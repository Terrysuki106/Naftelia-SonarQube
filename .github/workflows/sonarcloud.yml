name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-cov

      - name: Check Python compilation
        run: python -m compileall -q backend

      - name: Run tests and generate coverage
        run: >
          python -m pytest tests -v
          --cov=backend
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --junitxml=test-results.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Save test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
